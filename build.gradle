plugins {
    id 'java'
//    id 'application'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

//application {
//    mainClass.set('com.mpesa.sampleapi.MainApp')
//}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'io.github.openpaydev.mpesa:mpesa-core:1.0.0-SNAPSHOT'
    implementation 'io.github.openpaydev.mpesa:mpesa-backend:1.0.0-SNAPSHOT'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    compileOnly 'org.projectlombok:lombok:1.18.38' // Use the latest stable version

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

test {
    useJUnitPlatform()
}
